<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 52" width="230" height="52" fill="none">
  <defs>
    <linearGradient id="aoniconDarkSunset1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#FC653C" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <linearGradient id="aoniconDarkSunset2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF2E63" />
    </linearGradient>
    <filter id="glowSunset" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FC653C" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Brand Symbol / Emblem: Futuristic Prism "A" (Sunset Neon Glow) -->
  <g transform="translate(4, 3)" filter="url(#glowSunset)">
    <!-- Left Stem -->
    <path d="M 22 2 L 6 42 L 14 42 L 22 18 L 27 30 L 33 26 Z" fill="url(#aoniconDarkSunset1)" />
    <!-- Right Stem -->
    <path d="M 22 2 L 38 42 L 30 42 L 22 18 L 27 30 L 21 34 Z" fill="url(#aoniconDarkSunset2)" />
    <!-- Central AI Core Node / Crossbar -->
    <polygon points="17,33 27,33 29,38 15,38" fill="url(#aoniconDarkSunset1)" />
    <circle cx="22" cy="18" r="3.2" fill="#FFA000" />
  </g>

  <!-- Typography: Wordmark "AONICON" in Clean White -->
  <g transform="translate(56, 32)">
    <text font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="0.04em" fill="#FFFFFF">
      AON<tspan fill="url(#aoniconDarkSunset1)">ICON</tspan>
    </text>
  </g>

  <!-- Tagline: "DIGITAL & AI AGENCY" -->
  <g transform="translate(57, 44)">
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="0.28em" fill="#FFA000">
      DIGITAL &amp; AI AGENCY
    </text>
  </g>
</svg>
